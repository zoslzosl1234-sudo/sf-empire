<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="AI GM과 플레이하는 SF 우주 제국 시뮬레이션"
  >

  <meta
    name="theme-color"
    content="#080b14"
  >

  <!-- PWA -->
  <link
    rel="manifest"
    href="/manifest.json"
  >

  <!-- iPhone 홈 화면 앱 설정 -->
  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="SF Empire"
  >

  <title>SF 우주 제국</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <!-- =========================
       상단 헤더
  ========================== -->

  <header class="topbar">

    <div class="brand">
      <div class="brand-mark">
        ✦
      </div>

      <div class="brand-text">
        <strong>
          SF 우주 제국
        </strong>

        <small>
          AI GM · v3.2
        </small>
      </div>
    </div>

    <div class="top-actions">

      <!-- app.js가 이 버튼 앞에
           저장 / 불러오기 버튼을 자동 생성함 -->

      <button
        id="newGame"
        type="button"
        class="ghost-btn"
      >
        새 게임
      </button>

    </div>

  </header>


  <!-- =========================
       메인 화면
  ========================== -->

  <main class="app">

    <!-- 첫 실행 화면 -->

    <section
      id="hero"
      class="hero"
    >

      <div class="hero-symbol">
        ✦
      </div>

      <p class="eyebrow">
        SF EMPIRE SIMULATION
      </p>

      <h1>
        당신의 문명을<br>
        우주로 이끄십시오
      </h1>

      <p class="hero-copy">
        종족과 정치체계를 선택하고,
        행성을 개척하며,
        연구·외교·전쟁을 통해
        당신만의 우주 제국을 건설하세요.
      </p>

      <button
        id="startGame"
        type="button"
        class="primary-btn"
      >
        게임 시작
      </button>

      <p class="save-notice">
        진행 상황은 이 스마트폰에
        자동으로 저장됩니다.
      </p>

    </section>


    <!-- 대화 / 게임 로그 -->

    <section
      id="log"
      class="log"
      aria-live="polite"
    >
    </section>


    <!-- Gemini 응답 대기 표시 -->

    <div
      id="thinking"
      class="thinking hidden"
      aria-live="polite"
    >
      <span class="thinking-dot"></span>
      <span class="thinking-dot"></span>
      <span class="thinking-dot"></span>

      <span class="thinking-text">
        GM이 상황을 계산하고 있습니다...
      </span>
    </div>

  </main>


  <!-- =========================
       하단 명령 입력창
  ========================== -->

  <form
    id="composer"
    class="composer hidden"
  >

    <div class="input-wrap">

      <textarea
        id="message"
        rows="1"
        maxlength="12000"
        placeholder="행동이나 명령을 입력하세요..."
        autocomplete="off"
      ></textarea>

      <button
        id="send"
        type="submit"
        class="send-btn"
        aria-label="명령 전송"
      >
        전송
      </button>

    </div>

    <div class="composer-hint">
      자유롭게 행동을 입력할 수 있습니다.
    </div>

  </form>


  <!-- =========================
       게임 JavaScript
  ========================== -->

  <script
    src="/app.js"
  ></script>


  <!-- =========================
       PWA Service Worker
  ========================== -->

  <script>
    if ('serviceWorker' in navigator) {

      window.addEventListener(
        'load',
        () => {

          navigator.serviceWorker
            .register('/sw.js')
            .then(registration => {

              console.log(
                'SF Empire Service Worker 등록 완료:',
                registration.scope
              );

            })
            .catch(error => {

              console.error(
                'Service Worker 등록 실패:',
                error
              );

            });

        }
      );

    }
  </script>

</body>
</html>
